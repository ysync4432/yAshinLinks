function vC(){
 const l=sorted(cats);
 $("#view").innerHTML=`<div class="ph"><div><h2>Categorias</h2><div class="sub">Cada categoria vira uma seção no site público.</div></div><button class="btn p vt" data-a="newc">${ic("plus")}Nova categoria</button></div>`+(l.length?"":`<div class="cd" style="margin-bottom:14px"><h3>Comece rápido</h3><p>Crie as categorias padrão e depois renomeie como quiser.</p><button class="btn p" data-a="defc">Criar categorias padrão</button></div>`)+`<div class="cl">${l.map(c=>`<div class="cr fi" data-id="${c.id}"><div class="ibt">${ic(c.icon)}</div><div class="mid"><input value="${esc(c.name)}" data-a="cname" aria-label="Nome"><div class="r"><select data-a="cicon">${Object.entries(ICONS).map(([k,t])=>`<option value="${k}" ${k===c.icon?"selected":""}>${t}</option>`).join("")}</select><small style="color:var(--mu);align-self:center;white-space:nowrap">${groups.filter(g=>g.cat===c.id).length} grupo(s)</small></div></div><div class="acts"><button class="btn s" data-a="cup" aria-label="Subir">${ic("up")}</button><button class="btn s" data-a="cdn" aria-label="Descer">${ic("down")}</button><button class="btn s d" data-a="cdel" aria-label="Excluir">${ic("trash")}</button></div></div>`).join("")}</div>`;
}
/* ---------- site ---------- */
function vS(){
 const m={...DEF,...meta},f=(k,l,t,cl="")=>`<div class="${cl}"><label class="l">${l}</label>${t==="ta"?`<textarea id="m-${k}" rows="3" data-pv>${esc(m[k])}</textarea>`:`<input id="m-${k}" value="${esc(m[k])}" data-pv>`}</div>`;
 $("#view").innerHTML=`<div class="ph"><div><h2>Site</h2><div class="sub">Nome, textos, logo e contato do site público.</div></div></div><div class="sg"><div class="cd"><h3>Dados do site</h3><p>Aparecem na página inicial e no rodapé.</p><div class="fg">${f("name","Nome do site")}${f("wa","WhatsApp (DDI + número)")}${f("title","Título principal","ta","full")}${f("sub","Subtítulo","ta","full")}${f("credits","Créditos","i","full")}</div><label class="l">Logo</label><div class="lph" id="lg" style="${m.logo?`background-image:url('${m.logo}')`:""}">${m.logo?"":"Sem logo"}</div><div class="btns"><button class="btn" data-a="logo">${ic("img")}Enviar logo</button><button class="btn d" data-a="nologo">Remover</button></div><div class="btns"><button class="btn p" data-a="savem">Salvar site</button></div></div>
 <div class="cd"><h3>Pré-visualização</h3><p>Como o topo do site fica.</p><div class="pv"><div class="pb"><div class="lg" id="plg" style="${m.logo?`background-image:url('${m.logo}')`:""}">${m.logo?"":"LX"}</div><span id="pn">${esc(m.name)}</span></div><h5 id="pt">${esc(m.title)}</h5><p id="ps">${esc(m.sub)}</p><span class="bt">Ver grupos</span></div></div></div>`;
}
function pv(){const g=k=>($("#m-"+k)||{}).value||"";if(!$("#pt"))return;$("#pn").textContent=g("name");$("#pt").textContent=g("title");$("#ps").textContent=g("sub")}
/* ---------- publish ---------- */
function vP(){
 $("#view").innerHTML=`<div class="ph"><div><h2>Publicar & Backup</h2><div class="sub">Leve as mudanças ao site e proteja seus dados.</div></div></div><div class="sg"><div class="cd"><h3>Como funciona</h3><p>Cada alteração aparece no site em tempo real, sem republicar.</p><ol class="stp"><li>Edite grupos, categorias e dados do site aqui.</li><li>O site público recebe a mudança na hora.</li><li>Use o backup para guardar uma cópia.</li></ol><div class="note">${groups.filter(g=>!g.hidden).length} grupo(s) visíveis no site, em ${cats.length} categoria(s).</div></div>
 <div class="cd"><h3>Backup</h3><p>Grupos, categorias, fotos e dados do site num único arquivo.</p><div class="btns"><button class="btn" data-a="bk">${ic("dl")}Baixar</button><button class="btn" data-a="cp">${ic("copy")}Copiar</button><button class="btn" data-a="rs">${ic("upl")}Restaurar</button></div></div></div>`;
}
/* ---------- modal grupo ---------- */
function openG(g){
 ed=g?{...g}:{id:uid("g"),name:"",cat:fc!=="all"?fc:(sorted(cats)[0]||{}).id||"",link:"",desc:"",img:"",status:"open",msg:"",hidden:false,vip:false,order:Date.now()};
 const tg=(id,t,s,v)=>`<div class="sw"><div>${t}<small>${s}</small></div><input class="tgl" type="checkbox" id="${id}" ${v?"checked":""}></div>`;
 $("#sheet").innerHTML=`<div class="ph"><h2>${g?"Editar grupo":"Novo grupo"}</h2><button class="btn s" data-a="x" aria-label="Fechar">${ic("x")}</button></div><div class="fm"><div>
 <label class="l" style="margin-top:0">Nome</label><input id="f-name" value="${esc(ed.name)}" data-fp>
 <label class="l">Categoria</label><select id="f-cat" data-fp>${sorted(cats).map(c=>`<option value="${c.id}" ${c.id===ed.cat?"selected":""}>${esc(c.name)}</option>`).join("")||'<option value="">Crie uma categoria antes</option>'}</select>
 <label class="l">Link do grupo</label><input id="f-link" inputmode="url" placeholder="https://chat.whatsapp.com/…" value="${esc(ed.link)}" data-fp>
 <label class="l">Descrição</label><textarea id="f-desc" rows="3" data-fp>${esc(ed.desc)}</textarea>
 <label class="l">Status</label><select id="f-st" data-fp>${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${k===ed.status?"selected":""}>${t}</option>`).join("")}</select>
 <label class="l">Aviso do status (opcional)</label><input id="f-msg" placeholder="Ex: abre sexta às 20h" value="${esc(ed.msg)}">
 ${tg("f-hid","Ocultar do site","Não aparece para os visitantes",ed.hidden)}${tg("f-vip","Destaque ★ VIP","Marca o grupo como especial",ed.vip)}</div>
 <div class="rt"><label class="l" style="margin-top:0">Foto de capa</label><div class="cp" id="cp"></div><div class="btns" style="margin-top:10px"><button class="btn" data-a="img">${ic("img")}Enviar foto</button><button class="btn d" data-a="noimg">Remover</button></div></div></div>
 <div class="btns"><button class="btn" data-a="x">Cancelar</button>${g?`<button class="btn" data-a="dup">${ic("copy")}Duplicar</button><button class="btn d" data-a="rm">${ic("trash")}Excluir</button>`:""}<button class="btn p" data-a="sv" style="flex:2">${ic("ck")}Salvar</button></div>`;
 $("#mod").classList.add("on");cprev();
}
function cprev(){const v=id=>($(id)||{}).value||"";const im=ed.img;$("#cp").innerHTML=`<div class="cv" style="${im?`background-image:url('${im}')`:""}">${im?"":esc((v("#f-name")||"?")[0].toUpperCase())}</div><div class="bx"><h4>${esc(v("#f-name")||"Nome do grupo")}</h4><p>${esc(v("#f-desc")||"Descrição do grupo")}</p><span class="go">ENTRAR NO GRUPO</span></div>`}
const closeM=()=>$("#mod").classList.remove("on");
function saveG(){
 const n=$("#f-name").value.trim();if(!n){toast("Digite o nome");$("#f-name").focus();return}
 const l=$("#f-link").value.trim();if(l&&!/^https?:\/\//i.test(l)){toast("O link deve começar com https://");$("#f-link").focus();return}
 const d={name:n,cat:$("#f-cat").value,link:l,desc:$("#f-desc").value.trim(),img:ed.img||"",status:$("#f-st").value,msg:$("#f-msg").value.trim(),hidden:$("#f-hid").checked,vip:$("#f-vip").checked,order:ed.order||Date.now()};
 put("groups/"+ed.id,d,(groups.find(x=>x.id===ed.id)?"Editou “":"Criou “")+n+"”");closeM();
}
/* ---------- actions ---------- */
async function swap(col,list,id,dir){const i=list.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=list.length)return;const a=list[i],b=list[j];let oa=a.order||i,ob=b.order||j;if(oa===ob)ob=oa+dir;await run(async()=>{await db.doc(col+"/"+a.id).update({order:ob});await db.doc(col+"/"+b.id).update({order:oa})},"Ordem salva","Reordenou “"+a.name+"”")}
const bulk=(fn,msg)=>{const ids=[...sel];if(!ids.length)return;run(async()=>{for(const id of ids)await fn(id)},msg,msg+" ("+ids.length+")");}
function newCat(){const n=prompt("Nome da nova categoria:");if(n&&n.trim())put("cats/"+uid("c"),{name:n.trim(),icon:"grid",order:Date.now()},"Criou categoria “"+n.trim()+"”")}
function go(t){tab=t;try{localStorage.setItem("lt",t)}catch(e){}sel.clear();closeSb();render();scrollTo({top:0})}
const openSb=()=>{$("#sb").classList.add("on");$("#ov").classList.add("on")},closeSb=()=>{$("#sb").classList.remove("on");$("#ov").classList.remove("on")};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t],[data-fc],[data-a]");if(!t)return;
 if(t.dataset.t){go(t.dataset.t);return}
 if(t.dataset.fc){fc=t.dataset.fc;render();return}
 const a=t.dataset.a;
 if(a==="menu"){openSb();return}
 if(a==="theme"){const h=document.documentElement,d=h.dataset.theme==="dark"||(!h.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);h.dataset.theme=d?"light":"dark";return}
 if(a==="vw"){view=t.dataset.v;try{localStorage.setItem("lv",view)}catch(x){}render();return}
 if(a==="sort"){const k=t.dataset.k;if(sortk===k)sortd*=-1;else{sortk=k;sortd=1}render();return}
 if(a==="out"){signOut(auth).then(()=>location.reload());return}
 if(a==="sel"||a==="selall")return;
 if(!db)return;
 const row=t.closest("[data-id]"),id=row&&row.dataset.id,g=groups.find(x=>x.id===id),c=cats.find(x=>x.id===id);
 if(a==="new"){go("g");openG(null)}else if(a==="newc")newCat();
 else if(a==="ed")openG(g);else if(a==="x")closeM();else if(a==="sv")saveG();
 else if(a==="hid")upd("groups/"+id,{hidden:!g.hidden},(g.hidden?"Mostrou “":"Ocultou “")+g.name+"”");
 else if(a==="up"||a==="dn"){const l=sorted(groups).filter(x=>x.cat===g.cat);swap("groups",l,id,a==="up"?-1:1)}
 else if(a==="cup"||a==="cdn")swap("cats",sorted(cats),id,a==="cup"?-1:1);
 else if(a==="img")pickImg(900,d=>{ed.img=d;cprev()});
 else if(a==="noimg"){ed.img="";cprev()}
 else if(a==="rm"){if(confirm("Excluir este grupo?")){del("groups/"+ed.id,"Excluiu “"+ed.name+"”");closeM()}}
 else if(a==="dup"){const n={...ed,id:uid("g"),name:ed.name+" (cópia)",order:Date.now()};const{id:_,...d}=n;put("groups/"+n.id,d,"Duplicou “"+ed.name+"”");closeM()}
 else if(a==="cdel"){const n=groups.filter(x=>x.cat===id).length;if(confirm(n?`Excluir “${c.name}”? Os ${n} grupo(s) ficarão sem categoria.`:`Excluir “${c.name}”?`)){del("cats/"+id,"Excluiu categoria “"+c.name+"”");groups.filter(x=>x.cat===id).forEach(x=>db.doc("groups/"+x.id).update({cat:""}))}}
 else if(a==="defc"){["X-Treino:zap","Camp:trophy","Conversa:chat","Recrutamento de Guilda:shield"].forEach((s,i)=>{const[n,ico]=s.split(":");put("cats/"+uid("c")+i,{name:n,icon:ico,order:Date.now()+i})});log("Criou categorias padrão")}
 else if(a==="logo")pickImg(360,d=>{meta={...meta,logo:d};$("#lg").style.backgroundImage=`url('${d}')`;$("#lg").textContent="";$("#plg").style.backgroundImage=`url('${d}')`;$("#plg").textContent=""});
 else if(a==="nologo"){meta={...meta,logo:""};$("#lg").style.backgroundImage="";$("#lg").textContent="Sem logo";$("#plg").style.backgroundImage="";$("#plg").textContent="LX"}
 else if(a==="savem"){const m={logo:meta.logo||""};["name","title","sub","wa","credits"].forEach(k=>m[k]=$("#m-"+k).value.trim());put("meta/site",m,"Atualizou dados do site")}
 else if(a==="bk"||a==="cp")backup(a);else if(a==="rs")restore();
 else if(a==="bclr"){sel.clear();render()}
 else if(a==="bshow")bulk(i=>db.doc("groups/"+i).update({hidden:false}),"Mostrou grupos");
 else if(a==="bhide")bulk(i=>db.doc("groups/"+i).update({hidden:true}),"Ocultou grupos");
 else if(a==="bopen")bulk(i=>db.doc("groups/"+i).update({status:"open"}),"Abriu grupos");
 else if(a==="bfull")bulk(i=>db.doc("groups/"+i).update({status:"full"}),"Lotou grupos");
 else if(a==="bdel"){if(confirm("Excluir "+sel.size+" grupo(s)?")){bulk(i=>db.doc("groups/"+i).delete(),"Excluiu grupos");sel.clear()}}
});
document.addEventListener("change",e=>{
 const t=e.target,a=t.dataset.a;
 if(t.id==="fsel"){fs=t.value;listG();return}if(t.id==="srt"){sortk=t.value;sortd=1;listG();return}
 if(a==="sel"){const id=t.closest("[data-id]").dataset.id;t.checked?sel.add(id):sel.delete(id);listG();return}
 if(a==="selall"){const l=filt();t.checked?l.forEach(g=>sel.add(g.id)):sel.clear();listG();return}
 if(!a||!db)return;const id=t.closest("[data-id]").dataset.id;
 if(a==="st"){const g=groups.find(x=>x.id===id);upd("groups/"+id,{status:t.value},"Status de “"+g.name+"” → "+ST[t.value])}
 else if(a==="cname"){const v=t.value.trim();if(v)upd("cats/"+id,{name:v},"Renomeou categoria");else render()}
 else if(a==="cicon")upd("cats/"+id,{icon:t.value})});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q"){q=t.value;listG()}
 else if(t.id==="gq"){q=t.value;if(tab!=="g")go("g");else{const f=$("#q");if(f)f.value=q;listG()}}
 else if(t.dataset.pv!==undefined)pv();
 else if(t.dataset.fp!==undefined)cprev()});
$("#mod").onclick=e=>{if(e.target.id==="mod")closeM()};$("#ov").onclick=closeSb;
addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeM();closeSb()}
 if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#gq").focus()}
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&$("#mod").classList.contains("on"))saveG()});
addEventListener("resize",()=>{if(tab==="g")listG()});
/* ---------- backup ---------- */
const dump=()=>JSON.stringify({v:1,meta,cats:sorted(cats),groups:sorted(groups)});
async function backup(a){const t=dump();if(a==="cp"){try{await navigator.clipboard.writeText(t);toast("Copiado ✓")}catch(e){prompt("Copie:",t)}return}
 try{const b=new Blob([t],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="luxury-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast("Backup baixado ✓")}catch(e){try{await navigator.clipboard.writeText(t);toast("Download indisponível: copiei o backup")}catch(x){prompt("Copie:",t)}}}
function restore(){const t=prompt("Cole aqui o JSON do backup:");if(!t)return;let j;try{j=JSON.parse(t)}catch(e){toast("JSON inválido");return}
 if(!confirm("Restaurar? Itens com o mesmo ID serão substituídos."))return;
 run(async()=>{if(j.meta)await db.doc("meta/site").set(j.meta);for(const c of j.cats||[]){const{id,...d}=c;await db.doc("cats/"+id).set(d)}for(const g of j.groups||[]){const{id,...d}=g;await db.doc("groups/"+id).set(d)}},"Restaurado ✓","Restaurou backup")}
/* ---------- boot ---------- */
const DOM="@painel.local",toMail=u=>{u=String(u).trim().toLowerCase().replace(/\s+/g,"");return u.includes("@")?u:u+DOM};
const CFG_OK=firebaseConfig&&firebaseConfig.apiKey&&!/COLE/.test(firebaseConfig.apiKey);
let auth,fdb,started=false;
const adapter={doc:p=>{const r=doc(fdb,...p.split("/"));return{set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(f,e)=>onSnapshot(r,s=>f({data:()=>s.data()}),e)}},collection:p=>({onSnapshot:(f,e)=>onSnapshot(collection(fdb,p),s=>f({docs:s.docs}),e)})};
function listen(){
 const busy=()=>document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.closest(".cr,#view .fg");
 const snap=(path,fn)=>db.collection(path).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));if(!busy()&&!$("#mod").classList.contains("on"))render();else shell()},()=>toast("Sem permissão para ler "+path));
 snap("cats",l=>cats=l);snap("groups",l=>groups=l);snap("stats",l=>{stats={};l.forEach(x=>stats[x.id]=x)});
 db.doc("meta/site").onSnapshot(s=>{meta=s.data()||{};if(tab==="s"&&busy()){shell();return}render()},()=>{});
}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";$("#lb").disabled=true;try{await signInWithEmailAndPassword(auth,toMail($("#le").value),$("#lp").value)}catch(x){$("#lerr").textContent="Usuário ou senha incorretos."}$("#lb").disabled=false};
(function(){
 render();
 if(!CFG_OK){$("#lgn").classList.add("on");$("#lf").innerHTML='<h2>Falta configurar</h2><div class="sub">Abra o arquivo firebase-config.js e cole os dados do seu projeto Firebase.</div>';return}
 const app=initializeApp(firebaseConfig);fdb=getFirestore(app);auth=getAuth(app);
 onAuthStateChanged(auth,u=>{
  if(!u){db=null;ready=true;$("#lgn").classList.add("on");render();return}
  $("#lgn").classList.remove("on");db=adapter;canEdit=true;ready=true;userEmail=(u.email||"").replace(DOM,"");
  if(!started){started=true;listen()}render()});
})();
</script></body></html>
